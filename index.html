<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE Portal - State Lookup Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141b26;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }
        .header-bar {
            width: 100%;
            max-width: 1000px;
            background-color: #1a2332;
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            margin-bottom: 20px;
            border-bottom: 2px solid #233044;
        }
        .portal-title {
            font-weight: bold;
            font-size: 18px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .portal-badge {
            background-color: #ffa000;
            color: #141b26;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
        }
        .main-workspace {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .left-panel {
            flex: 1.3;
            background-color: #1a2332;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #233044;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .section-tag {
            color: #ffa000;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: block;
        }
        p.instruction {
            color: #a0aec0;
            font-size: 14px;
            line-height: 1.6;
        }
        .input-group {
            margin: 25px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: #111722;
            border: 1px solid #2d3d56;
            border-radius: 6px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #ffa000;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #3182ce;
        }
        .result-box {
            margin-top: 25px;
            padding: 18px;
            border-radius: 6px;
            display: none;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
        }
        .green-state {
            background-color: rgba(48, 180, 107, 0.12);
            color: #48bb78;
            border-left: 4px solid #48bb78;
        }
        .regular-state {
            background-color: rgba(226, 116, 35, 0.12);
            color: #ed8936;
            border-left: 4px solid #ed8936;
        }
        .error-state {
            background-color: rgba(229, 62, 62, 0.12);
            color: #f56565;
            border-left: 4px solid #f56565;
        }
        .right-panel {
            flex: 0.8;
            background-color: #1a2332;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #233044;
            max-height: 480px;
            overflow-y: auto;
        }
        .panel-header {
            font-size: 13px;
            font-weight: bold;
            color: #e2e8f0;
            border-bottom: 1px solid #2d3d56;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .state-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .state-chip {
            background-color: #111722;
            border: 1px solid #233044;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            font-size: 12px;
            color: #48bb78;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="portal-title">
        <span class="portal-badge">FE PORTAL</span> FE State Checker
    </div>
</div>

<div class="main-workspace">
    <div class="left-panel">
        <span class="section-tag">Target Lead Verification</span>
        <p class="instruction">Input the prospect's 10-digit number from your dialer to automatically identify target compliance zones and verification channels.</p>
        
        <div class="input-group">
            <input type="text" id="phoneNumber" placeholder="Enter Phone Number (e.g. 5125550143)" maxlength="14">
        </div>
        <button onclick="lookupNumber()">Verify Compliance State</button>

        <div id="result" class="result-box"></div>
    </div>

    <div class="right-panel">
        <div class="panel-header">🟢 APPROVED GREEN STATES REFERENCE</div>
        <div class="state-grid">
            <div class="state-chip">AL</div><div class="state-chip">AZ</div><div class="state-chip">CA</div>
            <div class="state-chip">CO</div><div class="state-chip">IL</div><div class="state-chip">IN</div>
            <div class="state-chip">KS</div><div class="state-chip">KY</div><div class="state-chip">MI</div>
            <div class="state-chip">MO</div><div class="state-chip">OH</div><div class="state-chip">PA</div>
            <div class="state-chip">SC</div><div class="state-chip">TN</div><div class="state-chip">TX</div>
        </div>
    </div>
</div>

<script>
// Complete master record of ALL valid North American Area Codes mapped to US States
const areaCodeToState = {
    "201":"NJ","202":"DC","203":"CT","205":"AL","206":"WA","207":"ME","208":"ID","209":"CA","210":"TX","212":"NY","213":"CA","214":"TX","215":"PA","216":"OH","217":"IL","218":"MN","219":"IN","220":"OH","223":"PA","224":"IL","225":"LA","228":"MS","229":"GA","231":"MI","234":"OH","239":"FL","240":"MD","248":"MI","251":"AL","252":"NC","253":"WA","254":"TX","256":"AL","260":"IN","262":"WI","267":"PA","269":"MI","270":"KY","272":"PA","274":"WI","276":"VA","281":"TX","301":"MD","302":"DE","303":"CO","304":"WV","305":"FL","307":"WY","308":"NE","309":"IL","310":"CA","312":"IL","313":"MI","314":"MO","315":"NY","316":"KS","317":"IN","318":"LA","319":"IA","320":"MN","321":"FL","323":"CA","325":"TX","330":"OH","331":"IL","332":"NY","334":"AL","336":"NC","337":"LA","339":"MA","341":"CA","346":"TX","347":"NY","351":"MA","352":"FL","360":"WA","361":"TX","364":"KY","380":"OH","385":"UT","386":"FL","401":"RI","402":"NE","404":"GA","405":"OK","406":"MT","407":"FL","408":"CA","409":"TX","410":"MD","412":"PA","413":"MA","414":"WI","415":"CA","417":"MO","419":"OH","423":"TN","424":"CA","425":"WA","430":"TX","432":"TX","434":"VA","435":"UT","440":"OH","442":"CA","443":"MD","447":"IL","458":"OR","463":"IN","469":"TX","470":"GA","475":"CT","478":"GA","479":"AR","480":"AZ","484":"PA","501":"AR","502":"KY","503":"OR","504":"LA","505":"NM","507":"MN","508":"MA","509":"WA","510":"CA","512":"TX","513":"OH","515":"IA","516":"NY","517":"MI","518":"NY","520":"AZ","530":"CA","534":"WI","539":"OK","540":"VA","541":"OR","551":"NJ","559":"CA","561":"FL","562":"CA","563":"IA","564":"WA","567":"OH","570":"PA","571":"VA","573":"MO","574":"IN","575":"NM","577":"WI","585":"NY","586":"MI","601":"MS","602":"AZ","603":"NH","605":"SD","606":"KY","607":"NY","608":"WI","609":"NJ","610":"PA","612":"MN","614":"OH","615":"TN","616":"MI","617":"MA","618":"IL","619":"CA","620":"KS","623":"AZ","626":"CA","628":"CA","629":"TN","630":"IL","631":"NY","636":"MO","641":"IA","646":"NY","650":"CA","651":"MN","657":"CA","660":"MO","661":"CA","662":"MS","667":"MD","669":"CA","678":"GA","681":"WV","682":"TX","689":"FL","701":"ND","702":"NV","703":"VA","704":"NC","706":"GA","707":"CA","708":"IL","712":"IA","713":"TX","714":"CA","715":"WI","716":"NY","717":"PA","718":"NY","719":"CO","720":"CO","724":"PA","725":"NV","726":"TX","727":"FL","731":"TN","732":"NJ","734":"MI","737":"TX","740":"OH","747":"CA","754":"FL","757":"VA","760":"CA","762":"GA","763":"MN","765":"IN","769":"MS","770":"GA","772":"FL","773":"IL","774":"MA","775":"NV","779":"IL","781":"MA","785":"KS","786":"FL","801":"UT","802":"VT","803":"SC","804":"VA","805":"CA","806":"TX","808":"HI","810":"MI","812":"IN","813":"FL","814":"PA","815":"IL","816":"MO","817":"TX","818":"CA","828":"NC","830":"TX","831":"CA","832":"TX","835":"PA","838":"NY","843":"SC","845":"NY","847":"IL","848":"NJ","850":"FL","854":"SC","856":"NJ","857":"MA","858":"CA","859":"KY","860":"CT","862":"NJ","863":"FL","864":"SC","865":"TN","870":"AR","872":"IL","878":"PA","901":"TN","903":"TX","904":"FL","906":"MI","908":"NJ","909":"CA","910":"NC","912":"GA","913":"KS","914":"NY","915":"TX","916":"CA","917":"NY","918":"OK","919":"NC","920":"WI","925":"CA","928":"AZ","929":"NY","930":"IN","931":"TN","934":"NY","936":"TX","937":"OH","938":"AL","940":"TX","941":"FL","947":"MI","949":"CA","951":"CA","954":"FL","956":"TX","959":"CT","970":"CO","971":"OR","972":"TX","973":"NJ","978":"MA","979":"TX","980":"NC","984":"NC","985":"LA","989":"MI"
};

const greenStates = new Set(["AL", "AZ", "CA", "CO", "IL", "IN", "KS", "KY", "MI", "MO", "OH", "PA", "SC", "TN", "TX"]);

function lookupNumber() {
    const input = document.getElementById("phoneNumber").value;
    const resultDiv = document.getElementById("result");
    const cleaned = input.replace(/\D/g, '');
    
    let areaCode = "";
    if (cleaned.length === 10) {
        areaCode = cleaned.substring(0, 3);
    } else if (cleaned.length === 11 && cleaned.startsWith('1')) {
        areaCode = cleaned.substring(1, 4);
    } else {
        resultDiv.style.display = "block";
        resultDiv.className = "result-box error-state";
        resultDiv.innerHTML = "⚠️ Alert: Please supply a standard 10-digit campaign phone number.";
        return;
    }
    
    const state = areaCodeToState[areaCode];
    
    if (!state) {
        resultDiv.style.display = "block";
        resultDiv.className = "result-box error-state";
        resultDiv.innerHTML = `⚠️ Area code (${areaCode}) not found in database. Check format.`;
        return;
    }
    
    resultDiv.style.display = "block";
    if (greenStates.has(state)) {
        resultDiv.className = "result-box green-state";
        resultDiv.innerHTML = `Verified State: ${state} <br> 🟢 Lead Status: APPROVED GREEN STATE`;
    } else {
        resultDiv.className = "result-box regular-state";
        resultDiv.innerHTML = `Verified State: ${state} <br> 🟠 Lead Status: NOT A GREEN STATE (Campaign Restriction)`;
    }
}
</script>

</body>
</html>
